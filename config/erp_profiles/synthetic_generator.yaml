# yaml-language-server: $schema=
# Auto-generated from src/generate_suppliers.py's canonical lists — see
# scratchpad/build_synthetic_profile.py. Do not hand-edit the sector/city
# lists here; regenerate instead if generate_suppliers.py's lists change.
name: synthetic_generator
description: 'Matches the raw output of src/generate_suppliers.py — this project''s own synthetic, intentionally
  messy Turkish supplier dataset. This is the ''reference'' profile: v1''s clean_suppliers.py behavior,
  reproduced exactly through the v2 profile-driven engine, as a regression check.'
encoding: utf-8-sig
required_canonical_columns:
- supplier_id
- company_name
- sector
- city
- company_size
- founded_year
- employee_count
- vkn
- supplier_annual_revenue_tl
- annual_purchase_volume_tl
- total_orders_last_year
- late_orders_last_year
- price_q1
- price_q2
- price_q3
- price_q4
- units_shipped_last_year
- units_returned_last_year
- contract_start_date
- last_audit_date
- payment_terms_days
- iso_certified
- overdue_debt_ratio
- debt_to_revenue_ratio
- payment_default_last_3y
column_mapping: []
category_maps:
- canonical_name: company_size
  value_map:
    mikro: Micro
    micro: Micro
    kucuk: Small
    small: Small
    orta: Medium
    medium: Medium
    buyuk: Large
    large: Large
- canonical_name: iso_certified
  value_map:
    evet: true
    'yes': true
    '1': true
    'true': true
    hayir: false
    'no': false
    '0': false
    'false': false
- canonical_name: payment_default_last_3y
  value_map:
    evet: true
    'yes': true
    '1': true
    'true': true
    hayir: false
    'no': false
    '0': false
    'false': false
closed_list_columns:
- canonical_name: sector
  canonical_values:
  - Tekstil
  - Otomotiv Yan Sanayi
  - Gıda ve İçecek
  - Elektronik
  - Kimya
  - Metal ve Çelik
  - İnşaat Malzemeleri
