# AHP (Analytic Hierarchy Process) pairwise comparisons for the operational
# risk criteria — an independent, rigorous alternative to just asserting the
# weights in config/scoring_weights.yaml. See docs/research_v2.md section 3.3
# and README.md "AHP-derived weights" for why this exists.
#
# Each comparison expresses "how much more important is `a` than `b`" on
# Saaty's standard 1-9 scale:
#   1 = equal importance        5 = strong importance
#   3 = moderate importance     7 = very strong importance
#                                9 = extreme importance
#   (2, 4, 6, 8 are intermediate judgments)
# A value < 1 (e.g. 1/3) means `b` is more important than `a`. Every
# unordered pair of criteria must appear exactly once — src/ahp.py validates
# this and fills in the reciprocal (b vs a) automatically.
#
# Run `python src/derive_ahp_weights.py` to compute weights + the
# consistency ratio (CR) from this file. CR must stay under 0.10 (Saaty's
# standard threshold) for the judgments to be considered internally
# consistent -- e.g. if delivery > price and price > dependency, delivery
# should not be judged as *less* important than dependency.

criteria:
  - delivery_delay_rate
  - price_volatility
  - supplier_dependency_ratio
  - quality_return_rate

comparisons:
  - a: delivery_delay_rate
    b: price_volatility
    value: 2
    rationale: >
      A late delivery stops production or sales immediately -- a more
      urgent, operationally disruptive risk than price fluctuation, but
      not overwhelmingly so (both matter).

  - a: delivery_delay_rate
    b: supplier_dependency_ratio
    value: 2
    rationale: >
      Same logic as above -- delivery risk is immediate and operational,
      concentration risk is a slower-moving structural exposure.

  - a: delivery_delay_rate
    b: quality_return_rate
    value: 3
    rationale: >
      Quality issues are typically caught and corrected faster than a
      missed delivery (see README's original weighting rationale), so
      delivery is judged moderately more important here.

  - a: price_volatility
    b: supplier_dependency_ratio
    value: 1
    rationale: >
      Both are financial/strategic risks of comparable weight by default
      -- matches the original 25%/25% asserted weighting exactly, so AHP
      can be checked against that starting assumption.

  - a: price_volatility
    b: quality_return_rate
    value: 2
    rationale: >
      Price volatility affects margin directly and continuously; quality
      issues are usually a smaller, more correctable share of volume.

  - a: supplier_dependency_ratio
    b: quality_return_rate
    value: 2
    rationale: >
      A concentrated supplier failing is a portfolio-level structural
      risk; a quality/return issue is usually contained to that
      supplier's own shipments.
