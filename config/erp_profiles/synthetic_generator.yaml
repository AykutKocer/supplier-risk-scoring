    as.: A.Ş.
    ltd.: Ltd.
    sti.: Şti.
    tic.: Tic.
    san.: San.
    ve: ve
    holding: Holding
    grup: Grup
numeric_columns:
- canonical_name: founded_year
  decimal_style: international
  target_dtype: Int64
- canonical_name: employee_count
  decimal_style: international
  target_dtype: Int64
- canonical_name: supplier_annual_revenue_tl
  decimal_style: auto
  target_dtype: float
